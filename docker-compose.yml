services:
  frontend:
    build:
      context: ./evaluation-web
      args:
        - URL_API=http://localhost:8000
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./evaluation-api
    container_name: backend
    ports:
      - "8000:8000"